# addJob

add-job-description=اكتب إعلانك وفقًا للإرشادات التالية: يجب أن يصف الإعلان الوظيفة أو الملف الشخصي للمرشح المرغوب ، يمكنك وضع التفاصيل الخاصة بك داخل الإعلان. نحن نتحقق من صحة الإعلانات ، وفي حالة عدم المطابقة ، سنقوم بتنبيهك عبر البريد الإلكتروني. بمجرد كتابة هذا الإعلان ، سوف تتلقى رسالة بريد إلكتروني للتحقق من صحة الإعلان. يمكنك اختيار إخفاء بياناتك تمامًا في هذه الحالة ، ستتلقى طلبات عبر موقعنا الإلكتروني. يمكنك اختيار الكشف عن بياناتك لمرشحي أحد إعلاناتك ، وفي هذه الحالة يتلقى المرشحون عبر البريد الإلكتروني إحداثياتك. أخيرًا ، أنت حر في وضع التفاصيل الخاصة بك في الإعلان.

