# addJob
add-job-description=Rédigez gratuitement votre offre d’emploi en respectant les consignes suivantes : <br> L'annonce doit décrire le poste et le profil du candidat recherché. Vous pouvez placer vos coordonnées à l'intérieur de l'annonce (email ou téléphone pour être recontacté par le candidat). Nous validons les annonces, en cas de non-conformité nous vous alerterons par email.<br> Une fois l'annonce d’emploi rédigée vous recevrez un email pour valider l'annonce. Vous pouvez choisir de cacher vos coordonnées, dans ce cas, vous recevrez des candidatures via notre site. Vous pouvez choisir de dévoiler vos coordonnées aux candidats dans l’une de vos annonces, dans ce cas le candidat reçois par email vos coordonnées.
job-desc-new-text=Vous êtes à la recherche d’une offre d’emploi au Maroc ? Que vous cherchiez un CDI, CDD ou une mission en Intérim, parcourez dans notre liste ci-dessous nos annonces d’emploi au Maroc et trouvez celle qui correspond à votre profil. 
Aucune annonce ne correspond à votre profil ? N’hésitez pas à revenir et consulter cette page. De nombreuses offres d’emploi vous sont proposées régulièrement.
